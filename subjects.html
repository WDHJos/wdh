let filtered = [...SUBJECTS];
const selected = new Set();

function norm(v) {
  return String(v ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}
function escapeHtml(v) {
  return String(v ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[ch]));
}
function splitGroups(value) {
  return norm(value)
    .split(";")
    .map(group => group.split("&").map(term => term.trim()).filter(Boolean))
    .filter(group => group.length > 0);
}
function subjectMatches(row) {
  const groups = splitGroups(document.getElementById("keywordSearch").value);
  if (!groups.length) return true;
  const haystack = norm((row.Subject_Description ?? "") + " " + (row.Keywords ?? ""));
  return groups.some(group => group.every(term => haystack.includes(term)));
}
function applyFilter() {
  filtered = SUBJECTS.filter(subjectMatches);
  render();
}
function render() {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  const frag = document.createDocumentFragment();
  for (const row of filtered) {
    const tr = document.createElement("tr");
    const checked = selected.has(row.Subject_Description);
    tr.innerHTML = `
      <td class="selectcol"><input type="checkbox" ${checked ? "checked" : ""} data-desc="${escapeHtml(row.Subject_Description)}"></td>
      <td class="idcol">${escapeHtml(row.Subject_ID)}</td>
      <td class="desccol">${escapeHtml(row.Subject_Description)}</td>
      <td class="kwcol">${escapeHtml(row.Keywords)}</td>
    `;
    frag.appendChild(tr);
  }
  tbody.appendChild(frag);
  tbody.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", () => {
      const desc = cb.getAttribute("data-desc");
      if (cb.checked) selected.add(desc); else selected.delete(desc);
      updateSelectedStatus();
    });
  });
  document.getElementById("status").textContent = `${filtered.length.toLocaleString("en-US")} subjects found`;
  updateSelectedStatus();
}
function updateSelectedStatus() {
  const n = selected.size;
  document.getElementById("selectedStatus").textContent = `${n} subject${n === 1 ? "" : "s"} selected`;
}
function goToPublications() {
  const subjects = Array.from(selected);
  if (!subjects.length) {
    alert("Select one or more subjects first.");
    return;
  }
  const param = encodeURIComponent(subjects.join("|"));
  window.location.href = `publications.html?subjects=${param}`;
}
document.getElementById("keywordSearch").addEventListener("input", () => {
  clearTimeout(window.__subjectTimer);
  window.__subjectTimer = setTimeout(applyFilter, 160);
});
document.getElementById("clearBtn").addEventListener("click", () => {
  document.getElementById("keywordSearch").value = "";
  applyFilter();
});
document.getElementById("publicationsBtn").addEventListener("click", goToPublications);
document.getElementById("publicationsBtnBottom").addEventListener("click", goToPublications);
render();
</script>
